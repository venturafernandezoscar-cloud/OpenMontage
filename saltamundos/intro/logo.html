<!doctype html>
<html><head><meta charset="utf-8"><title>Logo Saltamundos</title>
<style>
@font-face { font-family: Fredoka; src: url("../montaje/fonts/Fredoka-700.ttf"); font-weight: 700; }
html, body { margin: 0; background: transparent; overflow: hidden; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Logo «SALTAMUNDOS» sincronizado con el jingle (audio/jingle.py):
// sílabas SAL·TA·MUN·DOS caen en 1.5 / 2.0 / 2.5 / 3.0 s; campanilla y destellos en 3.5 s;
// 4.4–5.0 s la «O» (planeta-burbuja) crece y se traga la pantalla.
const W = 1920, H = 1080, FONT = 190;
const c = document.getElementById('c'), g = c.getContext('2d');
const SIL = [
  { txt: 'SAL', col: '#7FD8BE', sombra: '#3FA98A', t: 1.5 },
  { txt: 'TA',  col: '#FFD23F', sombra: '#D9A400', t: 2.0 },
  { txt: 'MUN', col: '#FF6F59', sombra: '#D9452F', t: 2.5 },
  { txt: 'DOS', col: '#9B5DE5', sombra: '#6D33B8', t: 3.0 },
];
const BASE_Y = 930;

function caida(t, t0) {             // posición vertical relativa y escala (squash & stretch)
  const d = t - t0;
  if (d < 0) return null;
  const T = 0.22;
  if (d < T) { const k = d / T; return { dy: -700 * (1 - k * k), sx: 0.88, sy: 1.18 }; }
  const e = d - T;
  const rebote = 120 * Math.exp(-6.5 * e) * Math.abs(Math.sin(e * 11));
  const golpe = Math.exp(-14 * e);
  return { dy: -rebote, sx: 1 + 0.28 * golpe, sy: 1 - 0.30 * golpe };
}

function planeta(cx, cy, r, t) {     // la «O»: burbuja iridiscente con anillo
  const gr = g.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
  gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.25, '#C9F2FF');
  gr.addColorStop(0.6, '#B79CFF'); gr.addColorStop(1, '#7FD8BE');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.lineWidth = Math.max(6, r * 0.08); g.strokeStyle = '#FFFFFF'; g.stroke();
  g.save(); g.translate(cx, cy); g.rotate(-0.35 + 0.05 * Math.sin(t * 3));
  g.lineWidth = Math.max(5, r * 0.07); g.strokeStyle = 'rgba(255,210,63,0.95)';
  g.beginPath(); g.ellipse(0, 0, r * 1.45, r * 0.38, 0, Math.PI * 0.05, Math.PI * 0.95, true); g.stroke();
  g.restore();
  g.fillStyle = 'rgba(255,255,255,0.85)';
  g.beginPath(); g.ellipse(cx - r * 0.38, cy - r * 0.42, r * 0.22, r * 0.12, -0.6, 0, Math.PI * 2); g.fill();
}

function texto(s, x, y, col, sombra) {
  g.font = `700 ${FONT}px Fredoka`; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  g.lineWidth = 34; g.strokeStyle = '#FFFFFF'; g.strokeText(s, x, y);           // borde blanco grueso
  g.fillStyle = sombra; g.fillText(s, x + 8, y + 10);                           // volumen
  g.fillStyle = col; g.fillText(s, x, y);
}

function estrella(x, y, r, a) {
  g.save(); g.globalAlpha = a; g.fillStyle = '#FFF6C2'; g.translate(x, y); g.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.25 : r; const an = i * Math.PI / 4; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  g.closePath(); g.fill(); g.restore();
}

function layout() {                  // posiciones fijas de cada sílaba (la O de DOS es el planeta)
  g.font = `700 ${FONT}px Fredoka`;
  const anchos = SIL.map(s => s.txt === 'DOS' ? g.measureText("D").width + FONT * 0.78 + g.measureText("S").width : g.measureText(s.txt).width);
  const sep = 44, total = anchos.reduce((a, b) => a + b, 0) + sep * 3;
  let x = (W - total) / 2;
  return SIL.map((s, i) => { const r = { ...s, x, w: anchos[i] }; x += anchos[i] + sep; return r; });
}
let L = null;

window.__fotograma = (n) => {
  const t = n / 60;
  if (!L) L = layout();
  g.clearRect(0, 0, W, H);
  let planetaPos = null;
  // «squash» común en 3.5 s (llegada del logo con la campanilla)
  const fin = t >= 3.5 ? Math.exp(-9 * (t - 3.5)) : 0;
  for (const s of L) {
    const m = caida(t, s.t); if (!m) continue;
    const cx = s.x + s.w / 2;
    g.save();
    g.translate(cx, BASE_Y + m.dy);
    g.scale(m.sx * (1 + 0.12 * fin), m.sy * (1 - 0.12 * fin));
    g.translate(-cx, -BASE_Y);
    if (s.txt === 'DOS') {
      g.font = `700 ${FONT}px Fredoka`;
      const wD = g.measureText("D").width, r = FONT * 0.37;
      texto('D', s.x, BASE_Y, s.col, s.sombra);
      const px = s.x + wD + r + 4, py = BASE_Y - FONT * 0.35;
      planetaPos = { x: px, y: py + m.dy, r };
      if (t < 4.4) planeta(px, py, r, t);
      texto("S", s.x + wD + 2 * r + 8, BASE_Y, s.col, s.sombra);
    } else {
      texto(s.txt, s.x, BASE_Y, s.col, s.sombra);
    }
    g.restore();
  }
  // destellos 3.5–4.4 s
  if (t >= 3.5 && t < 4.6) {
    const k = (t - 3.5) / 1.1;
    for (let i = 0; i < 14; i++) {
      const an = i * 2.4 + 0.5, rad = 600 + 100 * Math.sin(i * 1.7);
      const a = Math.max(0, Math.sin(Math.PI * Math.min(1, k * 1.3 + (i % 3) * 0.1)));
      estrella(W / 2 + Math.cos(an) * rad, BASE_Y - 70 + Math.sin(an) * rad * 0.3, 18 + (i % 4) * 7, a);
    }
  }
  // 4.4–5.0 s: la «O» crece y se traga la pantalla (transición a la primera escena)
  if (t >= 4.4 && planetaPos) {
    const k = Math.min(1, (t - 4.4) / 0.6), e = k * k * (3 - 2 * k);
    const r = planetaPos.r + e * 2300;
    planeta(planetaPos.x + (W / 2 - planetaPos.x) * e, planetaPos.y + (H / 2 - planetaPos.y) * e, r, t);
  }
  return c.toDataURL('image/png');
};
document.fonts.load(`700 ${FONT}px Fredoka`).then(() => { window.__listo = true; });
</script></body></html>
